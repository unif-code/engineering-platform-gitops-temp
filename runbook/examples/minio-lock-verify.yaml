apiVersion: batch/v1
kind: Job
metadata:
  labels:
    app.kubernetes.io/name: minio-lock-verify
    app.kubernetes.io/part-of: engineering-platform
  name: minio-lock-verify
  namespace: minio
spec:
  activeDeadlineSeconds: 600
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio-lock-verify
    spec:
      automountServiceAccountToken: false
      containers:
        - command:
            - /bin/sh
            - -ec
            - |
              mc alias set dev "${MINIO_ENDPOINT}" "${MINIO_ROOT_USER}" "${MINIO_ROOT_PASSWORD}" --api S3v4
              for bucket in postgres-backup etcd-backup audit-worm; do
                mc version info "dev/${bucket}"
              done
              object="lock-test-$(date -u +%Y%m%dT%H%M%SZ).txt"
              printf 'DEV Object Lock verification\n' | mc pipe "dev/audit-worm/${object}"
              mc retention set GOVERNANCE 1d "dev/audit-worm/${object}"
              mc retention info "dev/audit-worm/${object}"
              if mc rm "dev/audit-worm/${object}" 2>/tmp/delete-error; then
                echo 'ERROR: retained object was deleted' >&2
                exit 1
              fi
              echo 'EXPECTED: retained object deletion was denied'
              cat /tmp/delete-error
          env:
            - name: MC_CONFIG_DIR
              value: /tmp/mc
            - name: MINIO_ENDPOINT
              value: https://minio.minio.svc.cluster.local:9000
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: minio-root
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  key: user
                  name: minio-root
            - name: SSL_CERT_FILE
              value: /etc/minio-ca/ca.crt
          image: quay.io/minio/mc@sha256:eb4ea9884b77704230e2423e9004d2fa738dc272876b9cc41a297d29443b8780
          imagePullPolicy: IfNotPresent
          name: verify
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            - mountPath: /etc/minio-ca
              name: minio-ca
              readOnly: true
            - mountPath: /tmp
              name: tmp
      restartPolicy: Never
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: minio-ca
          secret:
            items:
              - key: tls.crt
                path: ca.crt
            secretName: minio-tls
        - emptyDir: {}
          name: tmp
  ttlSecondsAfterFinished: 86400
