apiVersion: batch/v1
kind: Job
metadata:
  labels:
    app.kubernetes.io/name: etcd-restore-drill
    app.kubernetes.io/part-of: engineering-platform
  name: etcd-restore-drill
  namespace: kube-system
spec:
  activeDeadlineSeconds: 1800
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: etcd-restore-drill
    spec:
      automountServiceAccountToken: false
      containers:
        - args:
            - snapshot
            - status
            - /restore/snapshot.db
            - --write-out=table
          command:
            - /usr/local/bin/etcdutl
          image: registry.k8s.io/etcd@sha256:aa2b41e3f99c9a337b82f687875a63c5119e6d39bc43fc76b6c40a96f55cf391
          imagePullPolicy: IfNotPresent
          name: status
          resources:
            limits:
              cpu: 200m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 0
            runAsUser: 0
          volumeMounts:
            - mountPath: /restore
              name: restore
      initContainers:
        - command:
            - /bin/sh
            - -ec
            - |
              mc alias set storage "${MINIO_ENDPOINT}" "${MINIO_ACCESS_KEY}" "${MINIO_SECRET_KEY}" --api S3v4
              object="$(mc find storage/etcd-backup --name 'etcd-*.db' --print '{base}' | sort | tail -n 1)"
              test -n "${object}"
              echo "restoring object: ${object}"
              mc cp "storage/etcd-backup/${object}" /restore/snapshot.db
          env:
            - name: MC_CONFIG_DIR
              value: /tmp/mc
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  key: ACCESS_KEY_ID
                  name: etcd-backup-minio
            - name: MINIO_ENDPOINT
              value: https://minio.minio.svc.cluster.local:9000
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  key: ACCESS_SECRET_KEY
                  name: etcd-backup-minio
            - name: SSL_CERT_FILE
              value: /etc/minio-ca/ca.crt
          image: quay.io/minio/mc@sha256:eb4ea9884b77704230e2423e9004d2fa738dc272876b9cc41a297d29443b8780
          imagePullPolicy: IfNotPresent
          name: download
          resources:
            limits:
              cpu: 200m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            - mountPath: /etc/minio-ca
              name: minio-ca
              readOnly: true
            - mountPath: /restore
              name: restore
            - mountPath: /tmp
              name: tmp
        - args:
            - snapshot
            - restore
            - /restore/snapshot.db
            - --data-dir=/restore/etcd-restored
          command:
            - /usr/local/bin/etcdutl
          image: registry.k8s.io/etcd@sha256:aa2b41e3f99c9a337b82f687875a63c5119e6d39bc43fc76b6c40a96f55cf391
          imagePullPolicy: IfNotPresent
          name: restore
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 0
            runAsUser: 0
          volumeMounts:
            - mountPath: /restore
              name: restore
      restartPolicy: Never
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: minio-ca
          secret:
            secretName: minio-ca
        - emptyDir:
            sizeLimit: 4Gi
          name: restore
        - emptyDir: {}
          name: tmp
  ttlSecondsAfterFinished: 86400
