apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app.kubernetes.io/name: etcd-backup
    app.kubernetes.io/part-of: engineering-platform
    platform.unif.internal/environment: dev
  name: etcd-backup
  namespace: kube-system
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1800
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: etcd-backup
            app.kubernetes.io/part-of: engineering-platform
        spec:
          automountServiceAccountToken: false
          containers:
            - command:
                - /bin/sh
                - -ec
                - |
                  timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
                  object="etcd-${timestamp}.db"
                  sha256sum /work/etcd-snapshot.db > "/work/${object}.sha256"
                  mc alias set storage "${MINIO_ENDPOINT}" "${MINIO_ACCESS_KEY}" "${MINIO_SECRET_KEY}" --api S3v4
                  mc cp /work/etcd-snapshot.db "storage/etcd-backup/${object}"
                  mc cp "/work/${object}.sha256" "storage/etcd-backup/${object}.sha256"
                  mc stat "storage/etcd-backup/${object}"
                  mc rm --recursive --force --older-than 7d storage/etcd-backup/
              env:
                - name: MC_CONFIG_DIR
                  value: /tmp/mc
                - name: MINIO_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      key: ACCESS_KEY_ID
                      name: etcd-backup-minio
                - name: MINIO_ENDPOINT
                  value: https://minio.minio.svc.cluster.local:9000
                - name: MINIO_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      key: ACCESS_SECRET_KEY
                      name: etcd-backup-minio
                - name: SSL_CERT_FILE
                  value: /etc/minio-ca/ca.crt
              image: quay.io/minio/mc@sha256:eb4ea9884b77704230e2423e9004d2fa738dc272876b9cc41a297d29443b8780
              imagePullPolicy: IfNotPresent
              name: upload
              resources:
                limits:
                  cpu: 200m
                  memory: 128Mi
                requests:
                  cpu: 10m
                  memory: 32Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
                runAsGroup: 1000
                runAsNonRoot: true
                runAsUser: 1000
              volumeMounts:
                - mountPath: /etc/minio-ca
                  name: minio-ca
                  readOnly: true
                - mountPath: /tmp
                  name: tmp
                - mountPath: /work
                  name: work
          dnsPolicy: ClusterFirstWithHostNet
          hostNetwork: true
          initContainers:
            - args:
                - --endpoints=https://127.0.0.1:2379
                - --cacert=/etc/kubernetes/pki/etcd/ca.crt
                - --cert=/etc/kubernetes/pki/etcd/healthcheck-client.crt
                - --key=/etc/kubernetes/pki/etcd/healthcheck-client.key
                - snapshot
                - save
                - /work/etcd-snapshot.db
              command:
                - /usr/local/bin/etcdctl
              env:
                - name: ETCDCTL_API
                  value: '3'
              image: registry.k8s.io/etcd@sha256:aa2b41e3f99c9a337b82f687875a63c5119e6d39bc43fc76b6c40a96f55cf391
              imagePullPolicy: IfNotPresent
              name: snapshot
              resources:
                limits:
                  cpu: 500m
                  memory: 256Mi
                requests:
                  cpu: 50m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
                runAsGroup: 0
                runAsUser: 0
              volumeMounts:
                - mountPath: /etc/kubernetes/pki/etcd
                  name: etcd-pki
                  readOnly: true
                - mountPath: /work
                  name: work
            - args:
                - snapshot
                - status
                - /work/etcd-snapshot.db
                - --write-out=table
              command:
                - /usr/local/bin/etcdutl
              image: registry.k8s.io/etcd@sha256:aa2b41e3f99c9a337b82f687875a63c5119e6d39bc43fc76b6c40a96f55cf391
              imagePullPolicy: IfNotPresent
              name: validate
              resources:
                limits:
                  cpu: 200m
                  memory: 128Mi
                requests:
                  cpu: 10m
                  memory: 32Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
                runAsGroup: 0
                runAsUser: 0
              volumeMounts:
                - mountPath: /work
                  name: work
          nodeSelector:
            node-role.kubernetes.io/control-plane: ''
          restartPolicy: Never
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          terminationGracePeriodSeconds: 30
          tolerations:
            - effect: NoSchedule
              key: node-role.kubernetes.io/control-plane
              operator: Exists
          volumes:
            - hostPath:
                path: /etc/kubernetes/pki/etcd
                type: Directory
              name: etcd-pki
            - name: minio-ca
              secret:
                secretName: minio-ca
            - emptyDir: {}
              name: tmp
            - emptyDir:
                sizeLimit: 4Gi
              name: work
      ttlSecondsAfterFinished: 86400
  schedule: 0 */3 * * *
  successfulJobsHistoryLimit: 3
  timeZone: Etc/UTC
