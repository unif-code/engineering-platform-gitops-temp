apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/name: minio-bootstrap
    app.kubernetes.io/part-of: engineering-platform
  name: minio-bootstrap-policies
  namespace: minio
data:
  audit-worm.json: |-
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Action": ["s3:GetBucketLocation", "s3:ListBucket", "s3:ListBucketMultipartUploads"],
          "Resource": ["arn:aws:s3:::audit-worm"]
        },
        {
          "Effect": "Allow",
          "Action": ["s3:AbortMultipartUpload", "s3:GetObject", "s3:GetObjectLegalHold", "s3:GetObjectRetention", "s3:GetObjectVersion", "s3:ListMultipartUploadParts", "s3:PutObject", "s3:PutObjectLegalHold", "s3:PutObjectRetention"],
          "Resource": ["arn:aws:s3:::audit-worm/*"]
        }
      ]
    }
  etcd-backup.json: |-
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Action": ["s3:GetBucketLocation", "s3:ListBucket", "s3:ListBucketMultipartUploads", "s3:ListBucketVersions"],
          "Resource": ["arn:aws:s3:::etcd-backup"]
        },
        {
          "Effect": "Allow",
          "Action": ["s3:AbortMultipartUpload", "s3:DeleteObject", "s3:DeleteObjectVersion", "s3:GetObject", "s3:GetObjectVersion", "s3:ListMultipartUploadParts", "s3:PutObject"],
          "Resource": ["arn:aws:s3:::etcd-backup/*"]
        }
      ]
    }
  postgres-backup.json: |-
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Action": ["s3:GetBucketLocation", "s3:ListBucket", "s3:ListBucketMultipartUploads", "s3:ListBucketVersions"],
          "Resource": ["arn:aws:s3:::postgres-backup"]
        },
        {
          "Effect": "Allow",
          "Action": ["s3:AbortMultipartUpload", "s3:DeleteObject", "s3:DeleteObjectVersion", "s3:GetObject", "s3:GetObjectRetention", "s3:GetObjectVersion", "s3:ListMultipartUploadParts", "s3:PutObject"],
          "Resource": ["arn:aws:s3:::postgres-backup/*"]
        }
      ]
    }
