apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/part-of: engineering-platform
    app.kubernetes.io/version: RELEASE.2025-09-07T16-13-09Z
  name: minio
  namespace: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
        app.kubernetes.io/part-of: engineering-platform
        app.kubernetes.io/version: RELEASE.2025-09-07T16-13-09Z
    spec:
      automountServiceAccountToken: false
      containers:
        - args:
            - server
            - /data
            - --address
            - :9000
            - --console-address
            - :9001
            - --certs-dir
            - /certs
          env:
            - name: HOME
              value: /tmp
            - name: MINIO_BROWSER
              value: 'on'
            - name: MINIO_PROMETHEUS_AUTH_TYPE
              value: public
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: minio-root
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  key: user
                  name: minio-root
            - name: MINIO_SERVER_URL
              value: https://minio.minio.svc.cluster.local:9000
          image: quay.io/minio/minio@sha256:a1a8bd4ac40ad7881a245bab97323e18f971e4d4cba2c2007ec1bedd21cbaba2
          imagePullPolicy: IfNotPresent
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: api
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          name: minio
          ports:
            - containerPort: 9000
              name: api
              protocol: TCP
            - containerPort: 9001
              name: console
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: api
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            limits:
              cpu: '1'
              memory: 2Gi
            requests:
              cpu: 100m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /data
              name: data
            - mountPath: /certs
              name: tls
              readOnly: true
            - mountPath: /tmp
              name: tmp
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-data
        - name: tls
          secret:
            items:
              - key: tls.crt
                path: public.crt
              - key: tls.key
                path: private.key
            secretName: minio-tls
        - emptyDir: {}
          name: tmp
